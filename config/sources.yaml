# Websites to watch. Add more with:  tracker add-source <url> --name "..." --state "..."
# tier 1 = every ~15 min, tier 2 = hourly, tier 3 = every ~6 h  (see docs/DEPLOY_GCP.md)
#
# IMPORTANT: URLs below are starting points that could not be verified from the build
# environment. Check each with:  tracker test-source <url>
# Then set enabled: true. A source that errors repeatedly triggers a health alert.
sources:
  - id: fci-home
    name: "FCI - Food Corporation of India (home)"
    url: "https://fci.gov.in/"
    tier: 1
    note: "National body that runs the OMSS rice e-auctions."

  - id: fci-sales-notices
    name: "FCI - Sales / OMSS notices"
    url: "https://fci.gov.in/sales-notice.php"
    tier: 1
    enabled: false
    note: "GUESSED URL - find the real OMSS/e-auction page on fci.gov.in and verify."

  - id: dfpd-home
    name: "Dept. of Food & Public Distribution"
    url: "https://dfpd.gov.in/"
    tier: 2
    enabled: false
    note: "Policy announcements about OMSS rice sales. Verify before enabling."

  - id: punjab-food-supplies
    name: "Punjab - Food, Civil Supplies & Consumer Affairs"
    url: "https://foodsuppb.gov.in/"
    state: "Punjab"
    tier: 2
    enabled: false
    note: "Example state source. Verify URL, then enable."
